<div class="full-screen-container">
  <div class="login-container">
    
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="logo-circle">AS</div>
      <h2>Se connecter</h2>
      <p class="subtitle">Connectez-vous à votre compte.</p>

      <div class="welcome-section">
        <h3>Bienvenue</h3>
        <p class="info-text">
          Entrez vos identifiants pour accéder à votre espace personnel. 
          Si vous n'avez pas encore de compte, vous pouvez en créer un.
        </p>
      </div>

      <div class="footer">© 2025 AssistSphere</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <h1 [ngClass]="errorClass" id="errorMsg">{{ errorMsg }}</h1>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
        <div [ngClass]="emailClass" id="emailDiv">
          <input type="email" id="email" placeholder="email" formControlName="email" required />
          <span class="msg" id="emailMsg">{{ emailMsg }}</span>
        </div>

        <div [ngClass]="passwordClass" id="passwordDiv">
          <input type="password" id="password" placeholder="password" formControlName="password" required />
          <span class="msg" id="passwordMsg">{{ passwordMsg }}</span>
        </div>

        <button type="submit" class="login-button">Login</button>
      </form>

      <a routerLink="/signup" id="createacc">create new account</a>
      <a routerLink="/resetpassword" class="forgot-password">forgot password ?</a>
    </div>
    
  </div>
</div>
