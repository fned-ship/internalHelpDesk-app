<div class="full-screen-container">
  <div class="login-container">
    <h1 [ngClass]="errorClass" id="errorMsg">{{ errorMsg }}</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
      <div [ngClass]="emailClass" id="emailDiv">
        <input type="email" id="email" placeholder="email..." formControlName="email" required />
        <span class="msg" id="emailMsg">{{ emailMsg }}</span>
      </div>

      <div [ngClass]="passwordClass" id="passwordDiv">
        <input type="password" id="password" placeholder="password..." formControlName="password" required />
        <span class="msg" id="passwordMsg">{{ passwordMsg }}</span>
      </div>

      <button type="submit" class="login-button">Login</button>
    </form>

    <a routerLink="/signup" id="createacc" style="display: block; width: 100%; margin-top: 20px;">create new account</a>
    <a routerLink="/resetpassword" class="forgot-password"
       style="margin-top: 15px; display: block; text-align: center; color: hsl(var(--primary-hsl)); text-decoration: none;">
       forgot password ?
    </a>
  </div>
</div>
