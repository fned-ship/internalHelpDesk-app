<div class="full-screen-container">
  <div class="update-container">
    
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="logo-circle">AS</div>
      <h2>Réinitialiser le mot de passe</h2>
      <p class="subtitle">Créez un nouveau mot de passe sécurisé.</p>

      <div class="welcome-section">
        <h3>Sécurité</h3>
        <p class="info-text">
          Choisissez un mot de passe fort comprenant des lettres majuscules, 
          minuscules, des chiffres et des caractères spéciaux pour protéger votre compte.
        </p>
      </div>

      <div class="footer">© 2025 AssistSphere</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <h1 class="login-title" id="errorMsg" [style.color]="errMsgColor">{{ errMsg }}</h1>
      
      <form [formGroup]="newPasswordForm" (ngSubmit)="onSubmit()" class="form">
        <div class="input-group" id="emailDiv">
          <input
            type="password"
            placeholder="Write a new password..."
            formControlName="password"
            [style.display]="display === 'none' ? 'block' : 'none'"
            id="password"
            required
          />
          
          <a
            class="login-button"
            [style.display]="display"
            id="login"
            [routerLink]="['/login']"
          >login</a>
        </div>
        <button
          type="submit"
          name="newPassword"
          class="update-button"
          [style.display]="display === 'none' ? 'block' : 'none'"
        >update</button>
      </form>
    </div>
    
  </div>
</div>
