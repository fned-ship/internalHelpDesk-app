<body>
    <div id="head">
    
    <div id="corner"><h1>Manager Space</h1></div>
    <img [src]="serverUrl+'/imagesProfile/'+curr.imageSrc" width="60px" height="60px">
    <h2>{{curr.firstName}} {{curr.lastName}}</h2>
    <div id="rightside">
    <div id="ai">
        <img src="images/AIIcon.png" width="20px" height="20px">
        <h5> Ai assistant &nbsp;</h5>
    </div>
    <img src="images/bellIcon.png" width="40px" height="40px" id="bellicon" (click)="lastbtn=6">
    </div>
</div>
    <div id="rest">
        <div id="sidebar">
        <div class="btn" (click)="lastbtn=1">
            <img src="images/general.png" width="40px" height="40px" >
            <h3> Profile</h3>
        </div>
        <div class="btn" (click)="lastbtn=2">
            <img src="images/DocumentIcon.png" width="40px" height="40px">
            <h3> Documents</h3>
        </div>
        <div class="btn" (click)="lastbtn=3">
            <img src="images/EmployeeIcon.png" width="40px" height="40px" >
            <h3> Employee </h3>
        </div>
        <div class="btn" (click)="lastbtn=4">
            <img src="images/clientIcon.png" width="40px" height="40px" >
            <h3> Chef </h3>
        </div>
        <div class="btn" (click)="lastbtn=5">
            <img src="images/ticketIcon.png" width="40px" height="40px">
            <h3> Ticket </h3>
        </div>
        </div>
    <compemployee [type]="'employee'" [role]="''" *ngIf="lastbtn==3"></compemployee>
    <compemployee [type]="'manager'" [role]="''" *ngIf="lastbtn==4"></compemployee>
    <editprofile [user]="curr" (userevent)="handleuser($event)" *ngIf="lastbtn==1"></editprofile>
    <documents [currentUserId]="curr.id" [role]="'manager'" *ngIf="lastbtn==2"></documents>
    </div>
</body>
