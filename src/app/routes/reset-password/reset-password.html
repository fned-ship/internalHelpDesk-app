<div class="full-screen-container">
  <div class="update-container">
    
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="logo-circle">AS</div>
      <h2>Mot de passe oublié</h2>
      <p class="subtitle">Réinitialisez votre mot de passe.</p>

      <div class="welcome-section">
        <h3>Récupération</h3>
        <p class="info-text">
          Entrez votre adresse email et nous vous enverrons un lien 
          pour réinitialiser votre mot de passe. Vérifiez votre boîte de réception 
          après l'envoi.
        </p>
      </div>

      <div class="footer">© 2025 AssistSphere</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <h1 class="login-title" id="errorMsg" [style.color]="errColor">{{ errMsg }}</h1>
      
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="form">
        <div class="input-group" id="emailDiv">
          <input type="email" placeholder="email" formControlName="email" id="email" required />
        </div>
        <button type="submit" name="resetPassword" class="update-button">send</button>
      </form>
    </div>
    
  </div>
</div>
